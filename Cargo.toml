[workspace]
resolver = "2"
members = [ 
  "database",
  "docu_dec_api",
  "gemini_ai"
, "tests"]

[workspace.dependencies]
dotenv = "0.15.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = {version = "1.0.134", features = ["preserve_order"]}
tokio = { version = "1.42.0", features = ["full"] }

google-generative-ai-rs = {version = "0.3.4", features = ["beta"]}
