<!DOCTYPE html>
<html>
<head>
<title>Project Generator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Project Report Generator</h1>
  <form id="projectForm">
    <label for="projectTitle">Project Title:</label><br>
    <input type="text" id="projectTitle" name="projectTitle"><br>
    <label for="studentName">Student Name:</label><br>
    <input type="text" id="studentName" name="studentName"><br>
    <label for="department">Department:</label><br>
    <input type="text" id="department" name="department"><br>
    <label for="university">University:</label><br>
    <input type="text" id="university" name="university"><br>
    <label for="date">Date:</label><br>
    <input type="date" id="date" name="date"><br>
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email"><br>

    <button type="submit">Generate Report</button>
  </form>
  <div id="result"></div>

  <script src="script.js"></script>
</body>
</html>
